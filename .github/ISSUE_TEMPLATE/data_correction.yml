name: Data correction
description: Propose an official-source-backed provider data correction.
title: "[Data]: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Data corrections require official or institutional sources. Do not attach customer or account records.
  - type: input
    id: provider_code
    attributes:
      label: Provider code
      description: Use the official raw code or five-digit IBAN code.
      placeholder: "0046"
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction
      description: Explain the proposed change.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Official source URL
      placeholder: "https://www.tcmb.gov.tr/..."
    validations:
      required: true
  - type: input
    id: checked_at
    attributes:
      label: Date checked
      placeholder: "2026-07-31"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include real IBANs, customer records, account owner data, or screenshots.
          required: true
