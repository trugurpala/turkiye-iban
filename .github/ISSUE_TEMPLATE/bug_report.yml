name: Hata bildirimi
description: Sentetik veriyle tekrar üretilebilen bir hatayı bildirin.
title: "[Hata]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gerçek IBAN, müşteri verisi, bordro, hesap sahibi bilgisi veya bunları içeren ekran görüntüsü eklemeyin. Güvenlik açığını public issue olarak değil, SECURITY.md içindeki özel kanaldan bildirin.
  - type: textarea
    id: summary
    attributes:
      label: Hatanın özeti
      description: Ne yanlış çalışıyor?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Gerçekleşen davranış
      description: Paket, veri dosyası veya workflow ne döndürdü?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
      description: Hangi sonucu bekliyordunuz ve neden?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: En küçük tekrar örneği
      description: Yalnız sentetik veriyle en küçük kod veya komut örneğini verin.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Çalışma ortamı
      description: İşletim sistemi, Node.js, paket yöneticisi ve modül/veri biçimini yazın.
      value: |
        İşletim sistemi:
        Node.js:
        Paket yöneticisi:
        Modül veya veri biçimi:
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paket veya veri sürümü
      placeholder: "0.2.3 veya 2026-08-02"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik onayı
      options:
        - label: Bu bildirimin yalnız sentetik IBAN örnekleri içerdiğini ve kişisel finansal veri içermediğini onaylıyorum.
          required: true
