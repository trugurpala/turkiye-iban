name: Bug report
description: Report a deterministic bug using synthetic data only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real IBANs, customer data, screenshots, payroll data, or account owner information.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What did the package, data file, or workflow return?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What result did you expect, and why?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest reproduction using synthetic data only.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS, Node.js and package-manager versions, module mode, or data format involved.
      value: |
        OS:
        Node.js:
        Package manager:
        Module mode or data format:
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package or data version
      placeholder: "0.2.0 or 2026-07-31"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains only synthetic IBAN examples and no personal financial data.
          required: true
