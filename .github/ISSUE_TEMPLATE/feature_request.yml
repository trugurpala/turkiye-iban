name: Özellik önerisi
description: Türkiye IBAN, veri, API veya belge kapsamında bir iyileştirme önerin.
title: "[Öneri]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Öneriyi Türkiye IBAN doğrulaması, kuruluş eşlemesi, referans veri veya proje belgeleri kapsamında tutun. Gerçek IBAN veya kişisel finansal veri eklemeyin.
  - type: textarea
    id: problem
    attributes:
      label: Sorun
      description: Bu öneri hangi kullanıcı veya geliştirici sorununu çözmeli?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Önerilen çözüm
      description: En küçük, kullanışlı ve geriye uyumlu değişikliği açıklayın.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Alan
      options:
        - JavaScript veya TypeScript API
        - Kanonik kuruluş verisi
        - JSON veya CSV çıktısı
        - SQL veya SQLite çıktısı
        - Şema veya doğrulama
        - Belgelendirme
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik onayı
      options:
        - label: Bu önerinin gerçek IBAN veya kişisel finansal veri içermediğini onaylıyorum.
          required: true
