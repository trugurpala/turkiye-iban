name: Feature request
description: Suggest an in-scope Turkish IBAN, data, API, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Turkish IBAN developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful and backward-compatible change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - JavaScript or TypeScript API
        - Canonical institution data
        - JSON or CSV output
        - SQL or SQLite output
        - Schema or validation
        - Documentation
    validations:
      required: true
