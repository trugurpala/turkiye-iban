name: Data correction
description: Propose an official-source-backed institution data correction.
title: "[Data]: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Data corrections require an official or institutional source. Never include a real IBAN, customer record, account owner, screenshot, or production financial data.
  - type: input
    id: provider_code
    attributes:
      label: Incorrect institution code
      description: Use the published raw code or five-digit Turkish IBAN provider code.
      placeholder: "0046"
    validations:
      required: true
  - type: textarea
    id: current_value
    attributes:
      label: Current value
      description: Copy only the incorrect non-personal reference value currently published by this project.
    validations:
      required: true
  - type: textarea
    id: expected_value
    attributes:
      label: Expected value
      description: State the corrected institution reference value.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL or document
      placeholder: "https://www.tcmb.gov.tr/..."
    validations:
      required: true
  - type: input
    id: accessed_at
    attributes:
      label: Source access date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no real IBAN or personal financial data.
          required: true
