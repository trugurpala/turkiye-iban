name: Veri düzeltmesi
description: Resmî kaynağa dayanan bir kuruluş verisi düzeltmesi önerin.
title: "[Veri]: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Veri düzeltmesi resmî veya kurumsal bir kaynak gerektirir. Gerçek IBAN, müşteri kaydı, hesap sahibi, ekran görüntüsü veya üretim finansal verisi eklemeyin.
  - type: input
    id: provider_code
    attributes:
      label: Düzeltilmesi gereken kuruluş kodu
      description: Yayımlanmış ham kodu veya beş haneli Türkiye IBAN kuruluş kodunu yazın.
      placeholder: "0046"
    validations:
      required: true
  - type: textarea
    id: current_value
    attributes:
      label: Mevcut değer
      description: Projede yayımlanan hatalı, kişisel olmayan referans değerini yazın.
    validations:
      required: true
  - type: textarea
    id: expected_value
    attributes:
      label: Beklenen değer
      description: Doğru olması gereken kuruluş referans değerini yazın.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Kaynak URL'si veya belge
      placeholder: "https://www.tcmb.gov.tr/..."
    validations:
      required: true
  - type: input
    id: accessed_at
    attributes:
      label: Kaynağa erişim tarihi
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik onayı
      options:
        - label: Bu bildirimin gerçek IBAN veya kişisel finansal veri içermediğini onaylıyorum.
          required: true
