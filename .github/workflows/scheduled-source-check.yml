name: Scheduled Source Check

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Review official source changes
    if: github.repository == 'trugurpala/turkiye-iban'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install source review tools
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Compare sources and normalized records
        id: source-review
        continue-on-error: true
        run: python scripts/check-sources.py --report source-change-report.md --json-report source-change-report.json
      - name: Create or update human-review issue
        if: steps.source-review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="Official Turkish IBAN source change requires review"
          EXISTING="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file source-change-report.md
          else
            gh issue create --title "$TITLE" --body-file source-change-report.md
          fi
      - name: Keep source changes behind a failing review gate
        if: steps.source-review.outcome == 'failure'
        run: exit 1
