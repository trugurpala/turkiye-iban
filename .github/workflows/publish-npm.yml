name: Publish NPM

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: NPM distribution tag
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish tr-iban
    if: github.repository == 'trugurpala/turkiye-iban'
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements.txt
          npm ci --ignore-scripts
      - name: Verify package
        run: npm test
      - name: Verify matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/typescript/package.json').version")"
          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY"
      - name: Publish with trusted publishing
        run: npm publish --workspace packages/typescript --tag "${{ inputs.dist-tag }}"
