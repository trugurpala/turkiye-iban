name: GitHub Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    if: github.repository == 'trugurpala/turkiye-iban'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements.txt
          npm ci --ignore-scripts
      - name: Verify tag and package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./packages/typescript/package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
      - name: Run verification suite
        run: npm test
      - name: Build release artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          npm pack --workspace packages/typescript --pack-destination staging
          npm sbom --workspace packages/typescript --sbom-format cyclonedx > "staging/tr-iban-${VERSION}.cdx.json"
          python scripts/prepare-release.py \
            --version "$VERSION" \
            --extra "staging/tr-iban-${VERSION}.tgz" \
            --extra "staging/tr-iban-${VERSION}.cdx.json"
          cd "release-artifacts/v${VERSION}"
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "release-artifacts/v${VERSION}/"* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
