name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python tools
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run format:check
      - name: Lint Python and TypeScript
        run: npm run lint
      - name: Type-check public package and tests
        run: npm run typecheck
      - name: Check generated-file drift
        run: npm run check:generated
      - name: Validate schemas and data formats
        run: npm run validate:data
      - name: Scan for non-synthetic IBAN data
        run: npm run check:privacy
      - name: Run unit tests
        run: npm run test:unit
      - name: Run integration tests
        run: npm run test:integration
      - name: Run executable examples
        run: npm run test:examples
      - name: Test release asset preparation
        run: npm run test:release
      - name: Inspect publish contents
        if: matrix.node-version == 24
        run: npm pack --workspace packages/typescript --dry-run
